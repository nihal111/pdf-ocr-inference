[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-lab-paddle-native-precision"
version = "0.1.0"
requires-python = ">=3.12"

[project.entry-points."vllm.general_plugins"]
paddle_native_precision = "paddle_native_precision:register"

[tool.setuptools.packages.find]
include = ["paddle_native_precision*"]
